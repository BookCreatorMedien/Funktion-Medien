<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was kann dieses Medium?</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d7a1f;--green-dark:#1a5210;
  --info-col:#1a4a8a;--info-light:#edf3fc;--info-border:#6a9cd8;
  --lernen-col:#5a2d00;--lernen-light:#fdf3e3;--lernen-border:#c8903a;
  --unter-col:#7a1a6a;--unter-light:#fdf0fa;--unter-border:#c870b8;
  --kontakt-col:#1a6a18;--kontakt-light:#eaf5e8;--kontakt-border:#6abf5e;
  --font:'Patrick Hand',cursive;--radius:12px;
}
body{font-family:var(--font);background:#f0f4ee;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

/* TOPBAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;background:#fff;border-bottom:1.5px solid #dce8d6;flex-shrink:0;gap:10px}
#topbar h1{font-size:18px;color:var(--green);white-space:nowrap}
#score-display{font-size:16px;color:#555;display:flex;gap:14px}
.score-r{color:var(--green);font-weight:600}.score-f{color:#c0392b;font-weight:600}
#progress-wrap{flex:1;max-width:180px;height:8px;background:#e0e0e0;border-radius:6px;overflow:hidden}
#progress-bar{height:100%;background:var(--green);border-radius:6px;transition:width .4s;width:0%}
#restart-btn{padding:5px 13px;border:none;border-radius:9px;background:var(--green);color:#fff;font-size:13px;font-family:var(--font);cursor:pointer;white-space:nowrap}
#restart-btn:hover{background:var(--green-dark)}

/* AUFGABE + KARTE */
#card-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 16px;background:#fff;border-bottom:1.5px solid #dce8d6;flex-shrink:0}
#aufgabe{font-size:16px;color:#555;text-align:center;line-height:1.5;max-width:280px}
#aufgabe strong{color:var(--green);font-size:17px;display:block;margin-bottom:3px}
#card-counter{font-size:12px;color:#bbb;white-space:nowrap;min-width:50px;text-align:center}
#card{width:115px;height:132px;background:#fff;border-radius:var(--radius);box-shadow:0 4px 18px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border:2px solid #e0e8d8;cursor:grab;transition:box-shadow .15s}
#card:active{cursor:grabbing}
#card.dragging{opacity:.85;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:scale(1.06)}
#card img{width:72px;height:72px;object-fit:contain;pointer-events:none}
#card .clbl{font-size:15px;font-weight:600;color:#333;text-align:center;pointer-events:none;line-height:1.2}
#card-hint{font-size:12px;color:#ccc;text-align:center;line-height:1.5;min-width:80px}

/* FEEDBACK BANNER */
#hinweis-bar{
  display:none;padding:9px 20px;text-align:center;
  font-size:17px;font-weight:500;flex-shrink:0;
  border-bottom:1.5px solid #dce8d6;
  transition:background .2s;
}
#hinweis-bar.correct{background:#e8f5e3;color:#1a5210}
#hinweis-bar.wrong{background:#fdf0ee;color:#8B2020}

/* ZONES */
#zones{flex:1;display:flex;flex-direction:row;overflow:hidden}
.zone{flex:1;display:flex;flex-direction:column;border-right:2px solid #e0e0e0;transition:filter .15s;overflow:hidden;min-width:0}
.zone:last-child{border-right:none}
#zone-info{background:var(--info-light);border-top:5px solid var(--info-border)}
#zone-lernen{background:var(--lernen-light);border-top:5px solid var(--lernen-border)}
#zone-unterhaltung{background:var(--unter-light);border-top:5px solid var(--unter-border)}
#zone-kontakt{background:var(--kontakt-light);border-top:5px solid var(--kontakt-border)}
.zone.drag-over{filter:brightness(.92)}
.zone-top{padding:8px 8px 4px;flex-shrink:0;text-align:center}
.zone-icon{font-size:26px;display:block;margin-bottom:2px}
.zone-title{font-size:16px;font-weight:700;pointer-events:none;line-height:1.2}
#zone-info .zone-title{color:var(--info-col)}
#zone-lernen .zone-title{color:var(--lernen-col)}
#zone-unterhaltung .zone-title{color:var(--unter-col)}
#zone-kontakt .zone-title{color:var(--kontakt-col)}
.zone-items{display:flex;flex-wrap:wrap;gap:5px;padding:5px 6px 8px;align-content:flex-start;overflow-y:auto;flex:1;justify-content:flex-start}

/* PLACED */
.placed{width:60px;height:72px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;animation:placeIn .25s cubic-bezier(.34,1.56,.64,1);border:2px solid;background:#fff;flex-shrink:0}
.placed.correct{border-color:#6abf5e;background:#e8f5e3}
.placed.wrong{border-color:#e07070;background:#fdf0ee}
.placed img{width:34px;height:34px;object-fit:contain}
.placed .plbl{font-size:10px;color:#555;text-align:center;line-height:1.2;font-family:var(--font)}
.placed .ptick{font-size:11px}
@keyframes placeIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* FEEDBACK EMOJI */
#feedback{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:50;pointer-events:none;opacity:0}
#feedback.show{animation:feedPop .6s forwards}
@keyframes feedPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}

/* WIN */
#win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
#win-box{background:#fff;border-radius:20px;padding:32px 44px;text-align:center;max-width:380px;width:90%;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#win-emoji{font-size:52px;margin-bottom:8px}
#win-title{font-size:24px;font-weight:700;color:var(--green);margin-bottom:8px}
#win-score-display{font-size:18px;margin-bottom:6px}
#win-msg{font-size:14px;color:#888;margin-bottom:22px;line-height:1.5}
#win-again{padding:11px 28px;border:none;border-radius:var(--radius);background:var(--green);color:#fff;font-size:16px;font-family:var(--font);cursor:pointer}
#win-again:hover{background:var(--green-dark)}
</style>
</head>
<body>

<div id="topbar">
  <h1>🎯 Was kann dieses Medium?</h1>
  <div id="score-display">
    <span>✅ <span id="sc-right" class="score-r">0</span></span>
    <span>❌ <span id="sc-wrong" class="score-f">0</span></span>
  </div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <button id="restart-btn">↺ Neu starten</button>
</div>

<div id="card-row">
  <div id="aufgabe">
    <strong>Jedes Medium kann vieles —<br>aber was ist seine wichtigste Aufgabe?</strong>
    Ziehe das Bild zur passenden Funktion ↓
  </div>
  <div id="card-counter"></div>
  <div id="card" draggable="true" ondragstart="onDragStart(event)" ondragend="onDragEnd(event)">
    <img id="card-img" src="" alt="">
    <span class="clbl" id="card-lbl"></span>
  </div>
  <div id="card-hint">Ziehe das Bild<br>nach unten ↓</div>
</div>

<div id="hinweis-bar"></div>

<div id="zones">
  <div class="zone" id="zone-info"
    ondragover="onDragOver(event,'info')"
    ondragleave="onDragLeave('info')"
    ondrop="onDrop(event,'info')">
    <div class="zone-top">
      <span class="zone-icon">📰</span>
      <div class="zone-title">Informationen<br>erhalten</div>
    </div>
    <div class="zone-items" id="items-info"></div>
  </div>

  <div class="zone" id="zone-lernen"
    ondragover="onDragOver(event,'lernen')"
    ondragleave="onDragLeave('lernen')"
    ondrop="onDrop(event,'lernen')">
    <div class="zone-top">
      <span class="zone-icon">📚</span>
      <div class="zone-title">Lernen</div>
    </div>
    <div class="zone-items" id="items-lernen"></div>
  </div>

  <div class="zone" id="zone-unterhaltung"
    ondragover="onDragOver(event,'unterhaltung')"
    ondragleave="onDragLeave('unterhaltung')"
    ondrop="onDrop(event,'unterhaltung')">
    <div class="zone-top">
      <span class="zone-icon">🎉</span>
      <div class="zone-title">Unterhaltung<br>& Spass</div>
    </div>
    <div class="zone-items" id="items-unterhaltung"></div>
  </div>

  <div class="zone" id="zone-kontakt"
    ondragover="onDragOver(event,'kontakt')"
    ondragleave="onDragLeave('kontakt')"
    ondrop="onDrop(event,'kontakt')">
    <div class="zone-top">
      <span class="zone-icon">💬</span>
      <div class="zone-title">Kontakt</div>
    </div>
    <div class="zone-items" id="items-kontakt"></div>
  </div>
</div>

<div id="feedback"></div>

<div id="win-overlay">
  <div id="win-box">
    <div id="win-emoji">🎉</div>
    <div id="win-title">Geschafft!</div>
    <div id="win-score-display"></div>
    <div id="win-msg"></div>
    <button id="win-again">↺ Nochmal spielen</button>
  </div>
</div>

const ZONES=['info','lernen','unterhaltung','kontakt'];
let queue=[],current=0,right=0,wrong=0;

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function startGame(){
  queue=shuffle(ALL);
  current=0;right=0;wrong=0;
  ZONES.forEach(z=>{document.getElementById('items-'+z).innerHTML=''});
  hideHinweis();
  updateScore();updateProgress();showCard();
  document.getElementById('win-overlay').style.display='none';
}

function showCard(){
  if(current>=queue.length){setTimeout(showWin,400);return;}
  const it=queue[current];
  document.getElementById('card-img').src=it.img;
  document.getElementById('card-lbl').textContent=it.word;
  document.getElementById('card-counter').textContent=(current+1)+' / '+queue.length;
}

function updateScore(){document.getElementById('sc-right').textContent=right;document.getElementById('sc-wrong').textContent=wrong}
function updateProgress(){document.getElementById('progress-bar').style.width=(current/queue.length*100)+'%'}

function onDragStart(e){hideHinweis();document.getElementById('card').classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function onDragEnd(){document.getElementById('card').classList.remove('dragging');ZONES.forEach(z=>document.getElementById('zone-'+z).classList.remove('drag-over'))}
function onDragOver(e,z){e.preventDefault();document.getElementById('zone-'+z).classList.add('drag-over')}
function onDragLeave(z){document.getElementById('zone-'+z).classList.remove('drag-over')}
function onDrop(e,z){e.preventDefault();document.getElementById('zone-'+z).classList.remove('drag-over');evaluate(z)}

let tx0=0,ty0=0,isDrag=false;
const cardEl=document.getElementById('card');
cardEl.addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;isDrag=false},{passive:true});
cardEl.addEventListener('touchmove',e=>{
  e.preventDefault();isDrag=true;
  const t=e.touches[0];
  cardEl.style.position='fixed';cardEl.style.left=(t.clientX-57)+'px';cardEl.style.top=(t.clientY-66)+'px';cardEl.style.zIndex='50';
  ZONES.forEach(z=>{
    const r=document.getElementById('zone-'+z).getBoundingClientRect();
    document.getElementById('zone-'+z).classList.toggle('drag-over',t.clientX>r.left&&t.clientX<r.right&&t.clientY>r.top&&t.clientY<r.bottom);
  });
},{passive:false});
cardEl.addEventListener('touchend',e=>{
  cardEl.style.position='';cardEl.style.left='';cardEl.style.top='';cardEl.style.zIndex='';
  ZONES.forEach(z=>document.getElementById('zone-'+z).classList.remove('drag-over'));
  if(!isDrag)return;
  const t=e.changedTouches[0];let chosen=null;
  ZONES.forEach(z=>{const r=document.getElementById('zone-'+z).getBoundingClientRect();if(t.clientX>r.left&&t.clientX<r.right&&t.clientY>r.top&&t.clientY<r.bottom)chosen=z});
  if(chosen)evaluate(chosen);
});

let hinweisTimer=null;
function evaluate(chosen){
  const it=queue[current],ok=it.funktion===chosen;
  if(ok)right++;else wrong++;
  updateScore();
  showFeedback(ok?'✅':'❌');
  showHinweis(ok, it);
  placeCard(it,chosen,ok);
  current++;updateProgress();
  if(current>=queue.length)setTimeout(showWin,1200);
  else showCard();
}

function showHinweis(ok, it){
  const bar=document.getElementById('hinweis-bar');
  bar.className=ok?'correct':'wrong';
  bar.textContent=ok?'✅ '+it.hinweis:'❌ '+it.word+' gehört zu: '+zoneName(it.funktion)+'. '+it.hinweis;
  bar.style.display='block';
}
function hideHinweis(){
  document.getElementById('hinweis-bar').style.display='none';
}
function zoneName(f){
  return{info:'Informationen erhalten',lernen:'Lernen',unterhaltung:'Unterhaltung & Spass',kontakt:'Kontakt'}[f]||f;
}

function showFeedback(em){const fb=document.getElementById('feedback');fb.textContent=em;fb.classList.remove('show');void fb.offsetWidth;fb.classList.add('show')}

function placeCard(it,zone,ok){
  const el=document.createElement('div');
  el.className='placed '+(ok?'correct':'wrong');
  el.innerHTML='<img src="'+it.img+'" alt="'+it.word+'"><span class="plbl">'+it.word+'</span><span class="ptick">'+(ok?'✅':'❌')+'</span>';
  document.getElementById('items-'+zone).appendChild(el);
}

const LOBS=[
  ['🏆','Super gemacht!','Du kennst die Funktionen der Medien!'],
  ['🌟','Mega!','Du weisst genau, wozu Medien da sind!'],
  ['🎊','Fantastisch!','Alle Medien richtig zugeordnet!'],
  ['⭐','Toll!','Du bist ein echter Medien-Profi!'],
];
function showWin(){
  const l=LOBS[Math.floor(Math.random()*LOBS.length)],pct=Math.round(right/queue.length*100);
  document.getElementById('win-emoji').textContent=l[0];
  document.getElementById('win-title').textContent=l[1];
  document.getElementById('win-score-display').innerHTML=
    '<span style="color:var(--green);font-weight:600">✅ '+right+' richtig</span>&nbsp;&nbsp;'+
    '<span style="color:#c0392b;font-weight:600">❌ '+wrong+' falsch</span>';
  document.getElementById('win-msg').textContent=pct===100?'Perfekte Runde – alle 18 richtig! '+l[2]:pct+'% richtig – '+l[2];
  document.getElementById('win-overlay').style.display='flex';
}

document.getElementById('restart-btn').addEventListener('click',startGame);
document.getElementById('win-again').addEventListener('click',startGame);
startGame();
</script>
</body>
